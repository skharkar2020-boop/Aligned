schema_version = "1.1"

artifacts = [
    "/workspace/output/result.json",
]

[task]
name = "aligned/rnaseq-metadata-misalignment"
description = "Reproduce a trustworthy top differentially-expressed gene from a compound-response RNA-seq pipeline whose output can no longer be taken at face value."

[metadata]
author_name = "Shalmalee Kharkar"
author_email = "skharkar2020@gmail.com"
author_organization = "Aligned"
category = "data-ml-infrastructure"
tags = ["rna-seq", "differential-expression", "data-pipeline-debugging", "sample-metadata-alignment", "pandas", "silent-data-corruption", "rna-seq-normalization"]
expert_time_estimate_hours = 8.0 # Orientation + crash fix (~0.5-0.75h), tracing and fixing the alignment bug rather than trusting the shape-only assert (~1-1.5h), splitting by cohort and finding the disagreement (~0.5-0.75h), the core judgment work -- comparing pooled/per-cohort/meta-analysis strategies, sign-checking, technical-vs-biological reasoning, nominal-vs-adjusted for replication -- (~3-4.5h), recognizing that broad, module-scale coordinated change makes total-count CPM's neutrality assumption questionable and switching to a composition-aware normalization (~1h), writeup and sanity-check against the pilot report (~0.5h).

difficulty_explanation = """The expression matrix and sample metadata are synthetic, deterministically generated data built to model a realistic compound-response RNA-seq analysis, not real patient or public repository data. At first, the task looks like a fairly simple software debugging problem, but fixing the sample alignment and repairing the pipeline does not automatically lead to the right biological answer. The harder part is deciding which signals in the data can actually be trusted -- and RNA-seq treatment responses are rarely limited to exactly one responding gene, so the task is to identify the strongest generalizable candidate, not to find the single gene with any real effect at all. Several candidates show strong cohort-specific effects and look quite similar at first, but the reason behind each signal is very different. One moves together with several other genes only in cohort 2, pointing to a hidden technical factor rather than a real treatment effect. Another shows the same kind of cohort-specific reversal in treatment response but without this shared expression pattern, making it much more likely to reflect genuine biological heterogeneity rather than a processing artefact. The agent also has to consider the direction of the treatment effect and not just whether a result is statistically significant. A cohort-specific analysis can therefore nominate the wrong gene if it checks significance without checking whether the direction of the effect makes biological sense. A further candidate passes ordinary significance testing in both cohorts and shows an almost identical effect size in each one -- the kind of clean, symmetric result that looks like the most trustworthy replication on its face. That apparent replication does not hold up under closer scrutiny: its significance in the weaker cohort depends on one or two individual samples rather than the treated group as a whole, and it stops clearing significance if either of those samples is set aside. The strongest generalizable candidate's own weaker, less symmetric evidence in that cohort is spread across the whole treated group and survives the same check. A fifth candidate is statistically the most convincing of all by ordinary standards -- significant in both cohorts after multiple-testing correction, a highly consistent effect size, and the strongest combined evidence of any candidate that survives every check so far -- and its apparent strength turns out to rest on nothing more exotic than favourable luck in a small-sample variance estimate: with only six samples in each treatment group, a single gene's own measure of its noise level is itself uncertain, and this candidate happened to draw an unusually tight one. Recognising that requires evaluating whether a candidate's evidence is stable once that per-gene noise estimate is treated with appropriate scepticism, not simply reading off the smallest p-value. Getting the right result therefore requires judging which signal is most likely to generalise across independent cohorts rather than simply choosing the smallest p-value, the most consistent-looking effect, or trusting whichever analysis produces the strongest-looking result. This makes the task a test of the same judgement a computational biologist or bioinformatician exercises when deciding whether a compound-response hit from a confirmatory cohort is trustworthy enough to advance, as much as it is a test of software debugging.

A further methodological wrinkle sits underneath all of this. A sizeable share of the panel carries a real, broadly-distributed transcriptional response (annotated, non-diagnostically, in the supplied module file) rather than one isolated hit. That is realistic -- compound treatment rarely moves exactly one gene -- but it also means the supplied pipeline's own normalization step, which scales every sample by its total read count, is no longer a neutral choice once so much of the panel is genuinely responding: a normalization whose own reference point shifts along with the treatment effect biases every other gene's apparent fold-change in the same direction, including the strongest generalizable candidate's own. Recognizing that this specific assumption has become questionable, and switching to a normalization that is not sensitive to it, is itself part of the judgment call this task tests -- not a separate, disconnected step. The richer module texture also creates a new, entirely legitimate secondary decoy: a background gene that is itself real, replicated, and robust across both cohorts, sitting in a module where a quarter of the other members show the same kind of broad, non-specific activity -- attractive competition for the top spot, but one that a properly-normalized, properly-moderated analysis still resolves in the true candidate's favor without needing any single hidden numeric cutoff to set it aside."""

solution_explanation = """The solution starts by diagnosing the same two problems that break the existing pipeline, then reimplements the analysis directly from the raw input files rather than editing and re-running the pipeline's own modules in place -- the two approaches reach the same result once both defects are correctly understood, and the reference solution's own correctness is checked against an independent, separately-written recomputation rather than against the pipeline code itself. The first defect is the deprecated NumPy cast, which causes the pipeline to crash immediately but is otherwise unrelated to the scientific problem. The more important issue is the sample alignment bug. During QC, the metadata is sorted by sample_id as strings, while the expression matrix remains in the original sequencer acquisition order. The pipeline then combines the two by position rather than matching them using the actual sample IDs, which means that most expression profiles end up attached to the wrong condition labels. The existing assert combined.shape[0] == metadata.shape[0] check does not catch this because it only confirms that the same number of samples are present after the merge. It does not check whether the expression profile in each row still belongs to the sample_id shown next to it. The reference solution reads the raw expression matrix and metadata directly and joins them explicitly on sample_id, which fixes the same defect in substance without requiring an edit to pipeline/io.py or pipeline/align.py specifically.

Once the alignment is repaired, the two cohorts should be analysed separately rather than pooled. The same differential-expression procedure is applied independently to cohort 1 and cohort 2 using Welch's t-test and BH-FDR correction on properly-normalized expression, rather than the supplied pipeline's own plain total-count CPM. That distinction matters here specifically because the panel is not mostly quiet: a substantial, broadly-distributed share of genes carry a real, module-scale treatment response (see the supplied gene_modules.csv), and once that much of the panel is genuinely moving, a normalization that divides every sample by its own total read count is no longer a neutral choice -- its own reference point shifts along with the treatment effect, which biases every other gene's apparent fold-change in the same direction, including the correct candidate's own. The reference solution instead uses median-of-ratios normalization (Anders & Huber 2010, the same normalization DESeq2 uses internally): each sample's size factor is the median, across genes with a positive count in every sample, of that gene's count divided by its geometric mean across samples. This is not the only acceptable choice -- limma-voom and edgeR's quasi-likelihood pipeline, both using TMM normalization, reach the same substantive conclusion on this dataset despite not computing numerically identical size factors (see task/README.md's "Round 9" section) -- but some composition-aware normalization is necessary once the data itself shows this pattern; total-count CPM is what the supplied, not-yet-repaired pipeline does by default, not what a properly-repaired analysis of this particular dataset should do.

For a top candidate identified in one cohort to be considered replicated, that specific candidate must also show nominal significance in the other cohort and the treatment effect must point in the same direction. The use of nominal significance applies specifically to this confirmation step. Cohort 2 can still use BH correction when it is being analysed independently for discovery, but when testing a candidate that has already been flagged in cohort 1, the question is whether that particular gene replicates rather than whether it independently survives another search across all 300 genes. Applying BH adjustment across the full gene set again for this single confirmation test can therefore be unnecessarily restrictive. This distinction matters in practice: in a fresh trial, using the BH-adjusted cohort 2 value instead of the nominal p-value at this step was enough to flip the analysis to the wrong answer.

More than one gene can pass this same-sign, nominally-significant check, and a weaker effect in one cohort is not automatically a reason to reject a candidate. Some degree of cross-cohort heterogeneity is expected, provided that the effect remains real and points in the same direction. But passing that check is necessary, not sufficient: before a candidate's apparent replication is trusted, it should be checked for robustness to individual samples. Within the cohort where a candidate's confirming evidence is weakest, dropping each treated sample once (leave-one-out) and recomputing the p-value against the full control group should still clear the same nominal-significance bar in the worst case, not just when every sample is included. One candidate in this dataset clears the same-sign, nominally-significant check with an unusually consistent effect size across both cohorts -- more consistent than the strongest generalizable candidate's own effect -- but its weaker cohort's significance depends on two specific samples and disappears if either one is dropped, while the strongest generalizable candidate's own weaker-cohort evidence is spread across its whole treated group and survives every single-sample removal.

Even among candidates that pass the same-sign, significance, and robustness checks, one more distinction has to be made before comparing their combined evidence: is each candidate's own apparent strength a stable estimate, or does it depend on a favourably tight (but statistically unreliable) small-sample variance estimate? With only six samples per group, a single gene's own variance estimate is itself a noisy quantity. One candidate in this dataset passes every check so far more convincingly than any other -- significant after multiple-testing correction in both cohorts, a strikingly consistent effect size, and the strongest raw combined evidence -- entirely because its own within-group variance in one cohort happened, by chance, to come out unusually small. Recomputing each candidate's significance with its variance shrunk toward a typical, dataset-derived value (an empirical-Bayes approach, with the strength of that shrinkage itself estimated from how much per-gene variances actually vary across the panel, not a fixed assumption) reveals that this candidate's apparent advantage evaporates, while the strongest generalizable candidate's own weaker-looking evidence holds up. When several genes survive all of these checks, the tiebreak is the strength of the MODERATED evidence across both cohorts rather than simply choosing the gene with the most similar effect size, or the smallest raw p-value, in each one. Fisher's method can be used to combine the two nominal (or moderated) p-values at this stage because agreement in effect direction has already been established.

The module layer adds one more legitimate competitor worth naming explicitly: a background gene, real (not a normalization artifact), same-signed and nominally significant in both cohorts, and robust to the same leave-one-out check as everything else -- sitting in a module where a quarter of the other members independently show the same kind of broad, non-specific activity, unlike the correct candidate's own module, where it is essentially the only responder. This gene is not eliminated by any of the checks above; it loses because the correct candidate's own combined evidence (moderated, cross-cohort) is stronger, by a comfortable margin under median-of-ratios normalization and confirmed independently under limma-voom/TMM and edgeR-QL/TMM (see task/README.md's "Round 9" section) -- not by a package-specific numerical coincidence. Its own module's unusually high hit-rate is corroborating context for why it is the less specific signal, not the mechanism the verifier actually uses to set it aside.

The competing signals also need to be examined rather than rejected only because they fail the replication rule. In particular, the rejected_competing_gene should be the gene whose apparent effect is linked to a technical artefact, not the gene showing genuine biological heterogeneity. This can be distinguished by checking whether several other genes move together with the candidate specifically within the same cohort. A shared cohort-specific expression pattern suggests that the signal is being driven by an underlying technical factor, whereas a gene showing a cohort-specific change without that broader shared structure is more consistent with real biological variation.

The final output should report the surviving gene using the statistics from the cohort in which its evidence is strongest, while also giving its fold-change in both cohorts. It should include the appropriate categorical heterogeneity assessment, the number of samples whose IDs were verified to match correctly after repairing the pipeline, and the competing gene that was rejected together with the reason for rejecting it. Finally, the historical pilot report in the repository describes an earlier, underpowered finding without naming a specific gene or giving numbers that identify one; it exists as a caution against assuming any prior claim is correct, not as corroborating evidence for whichever gene the current analysis nominates. The result has to be established entirely from the current dataset, independent of anything the pilot report does or does not say."""

verification_explanation = """The reference answer was checked independently rather than simply assuming that the repaired pipeline produced the correct result. The same analysis was run using two different major versions of pandas, from the 1.x and 2.x series, on the same input files and produced identical results. It was then cross-checked using a completely separate implementation that did not reuse the pipeline code or solve.py, but instead matched the two raw input files directly using sample_id. This produced the same answer, confirming that the reference result was not dependent on a particular implementation or software version.

The verifier checks more than just whether the correct gene was found. It requires the correct top_gene and rejected_competing_gene, checks both cohort-level fold-changes within tolerance, and verifies the heterogeneity_assessment label. analysis_strategy must still be one of five valid codes, but is no longer scored against the single reference code directly: repeated independent review found that an exact match there amounted to an undisclosed requirement to guess this task's internal label for a correct line of reasoning, on top of every other field already having to agree with the correct answer. It also checks verified_matching_sample_ids to make sure the alignment problem was actually fixed, and requires the rationale to explicitly state that the rejected competing gene's effect points the opposite direction between cohorts -- not merely to be present and non-trivial -- which is what actually closes the gap the analysis_strategy match was originally meant to catch.

The independent reference recomputation normalizes with median-of-ratios (Anders & Huber 2010, the same size-factor method DESeq2 uses internally) rather than the supplied pipeline's own total-count CPM -- see solution_explanation above for why that switch is necessary on this specific dataset, not merely a stylistic preference. This Python implementation was validated against real DESeq2's own estimateSizeFactors on the locked dataset (size factors agree to <0.3%), and the resulting candidate ranking was cross-checked against real limma-voom and edgeR's quasi-likelihood pipeline, both TMM-normalized: none of the three need to compute numerically identical size factors or p-values to agree on which gene wins once the same same-sign/nominal-significance/leave-one-out-robustness/moderated-combined-evidence logic is applied to each (see task/README.md's "Round 9" section for the full comparison). The verifier accordingly does not grade normalization choice directly -- there is no field for it, and LOG2FC_ABS_TOL/ADJ_P_LOG10_TOL below are wide enough to absorb the numeric differences between reasonable composition-aware choices -- it grades the properties that choice is supposed to produce: the right candidate, the right competitor rejected, and cohort-level numbers within tolerance of an independent recomputation.

Underneath these field-level checks, the independent reference recomputation itself tests internal scientific coherence rather than only hard-coding a single answer: a candidate is only treated as replicated if, in addition to being same-signed and nominally significant in both cohorts, its evidence in the weaker cohort survives a leave-one-out perturbation -- dropping each treated sample once and recomputing the p-value against the full control group, requiring the worst case across those drops to still clear the same significance bar used everywhere else, rather than a second, separately-chosen cutoff -- and, among candidates that clear that bar, the final ranking uses each candidate's evidence after its variance has been shrunk toward a dataset-derived typical value (with the strength of that shrinkage itself estimated from the data, not a fixed assumption), rather than raw p-values. This distinguishes a candidate whose apparent cross-cohort replication is real from one where it is a leave-one-out artefact of one or two samples or an artefact of a favourably tight small-sample variance estimate, using the locked dataset itself rather than a fixed recipe, and with the same numeric tolerances applied downstream regardless of which candidates these steps admit. The variance-moderation step was independently checked against three real, separately-installed differential-expression packages (each estimating its own moderation strength from the data, not from any parameter used to generate the data) before being implemented, and all three agreed with its conclusion on the locked dataset.

To make sure these checks could separate a sound analysis from a plausible but incorrect one, nine different wrong strategies were run against the locked dataset. Otherwise running the complete, correct replication-plus-robustness-plus-moderation procedure but leaving the supplied pipeline's own total-count CPM normalization in place (rather than switching to a composition-aware method) also fails: it promotes the round 9 module-layer competitor described in difficulty_explanation above (real, replicated, robust -- not a normalization glitch), because CPM's own reference point moves along with the module layer's broad coordinated response, which specifically dampens the correct candidate's own apparent evidence relative to everything else on the panel. Naming the module-layer competitor in the rationale without also fixing the normalization is not sufficient by itself -- the underlying per-gene statistics still have to come from a normalization that is not itself biased by the very pattern being reasoned about. A naive pooled analysis produces a completely different gene. Analysing cohort 2 alone also gives a different answer, and although that gene is nominally significant in cohort 1 without a sign-blind Fisher combination even being applied, its effect goes in the opposite direction there. Looking only at significance would therefore make it appear to replicate when it actually does not -- though as of round 9, this particular candidate's own cohort1 result (p=0.0505) sits just barely on the non-significant side, so on the current locked dataset a sign-blind Fisher combination or a nominal-significance-without-sign-check gate does not have this candidate available to mistakenly admit, and both recover the correct answer directly instead; this is a checked, accepted fact about the current calibration (see task/README.md's "Round 9" section), not a claim that checking direction is unnecessary in general -- the technical-artifact scenario immediately above still demonstrates why it is. A related, once-subtle failure mode runs the complete replication procedure correctly -- alignment, per-cohort analysis, same-sign and nominal significance in both cohorts, and leave-one-out robustness -- but ranks the surviving candidates by raw combined evidence instead of variance-moderated evidence. Through round 8 this reached a different gene that was, by every ordinary measure, the most convincing candidate in the dataset: significant after multiple-testing correction in both cohorts, a strikingly consistent effect size, and the strongest raw combined evidence of any candidate that passed every other check, entirely because of an unusually favourable small-sample variance estimate in one cohort. As of round 9, ranking by raw combined evidence among gate-survivors also recovers the correct answer on the locked dataset -- the module layer's composition effects moved the surrounding numbers enough that moderation is no longer the single mechanism separating the two candidates, though it still measurably weakens the decoy's raw advantage when applied and remains the scientifically correct choice. Preferring the most cross-cohort-consistent gate-surviving candidate over the one with materially stronger moderated evidence still reaches a different, wrong gene (the round-6 fragile-replication decoy): its cohort1 and cohort2 fold-changes are far more consistent than the correct answer's own deliberately asymmetric pair, and it does clear leave-one-out robustness, but its moderated combined evidence is measurably weaker. Leaving the supplied pipeline's total-count CPM normalization in place while otherwise running the complete procedure also still reaches a different, wrong gene, per the paragraph above.

Another plausible approach is to choose the gene with the most similar effect across the two cohorts, without checking whether that apparent replication is robust to individual samples. That gene clears ordinary significance in both cohorts and looks, on its face, like the cleanest replication in the dataset -- its cohort1 and cohort2 effect sizes are far more consistent with each other than the reference gene's own. But its weaker-cohort significance turns out to depend on one or two specific samples: removing either one and its result is no longer significant there, while the reference gene's own weaker, less symmetric evidence in that same cohort survives every single-sample removal. A replication rule based only on significance and sign, without checking robustness, is fooled by this gene precisely because its consistency looks so reassuring. There is also a separate trap around rejected_competing_gene: choosing the gene showing real biological heterogeneity is still incorrect even though excluding it as the final top_gene is appropriate. Its cohort-specific signal appears to be real, while the competitor that should be reported as rejected is the one linked to the technical artefact. A related trap admits both reversed-sign genes into the replicated pool by checking significance without checking sign at all; on the locked dataset this also reports the wrong top_gene, and rejected_competing_gene is separately wrong because neither reversed-sign gene is left available to report there.

All eight approaches differ from the locked reference on at least one field checked by the verifier, and importantly, they fail for different reasons. An agent can pool cohorts when it should not, ignore the direction of an effect, favour a consistent-looking or raw-strongest effect over a variance-stable one, or mistake real heterogeneity for a technical artefact. An analysis can even happen to identify the correct gene but still fail because the strategy used to reach it is not scientifically sound and cannot honestly justify, in the rationale, why the rejected competitor's own effect reverses direction between cohorts, or because it can no longer correctly name which gene should be rejected. The verifier therefore tests the reasoning used to reach the result rather than simply whether the expected gene name appears in the output.

A correlation-based check was also tested during task development to see whether the latent technical effect could be identified directly from groups of genes moving together. This was ultimately left out because there are only six samples in each cohort-condition group, making the correlations too noisy to reliably distinguish a genuinely linked gene from an unrelated one. The leave-one-out robustness check and the variance-moderation step above were each evaluated against that same concern and, unlike the correlation-based check, were found to reliably separate the designed genes at this sample size without over-triggering on ordinary borderline results elsewhere in the panel -- an earlier version of the leave-one-out check that considered all samples in a cohort rather than only the treated group did over-trigger on unrelated marginal hits and was narrowed for that reason, and an earlier candidate mechanism based on low absolute expression was abandoned after a faithful reimplementation of a standard minimum-expression filter showed it could not be made to fail that filter while remaining a statistically convincing candidate. Rather than including a check that was not statistically reliable at this sample size, the final verifier focuses on checks that can be reproduced consistently from the locked dataset.

The numeric tolerances were set from those same wrong-scenario margins rather than chosen arbitrarily. The fold-change check allows a difference of up to 0.2 from the independently recomputed value; log2 fold-change is essentially a plain difference of group means, so it barely moves between reasonable implementation choices (Welch's versus Student's t-test, a different multiple-testing correction, raw versus variance-moderated significance, or median-of-ratios versus TMM normalization -- see task/README.md's "Round 9" section), but naive pooling of both cohorts alone moves the strongest generalizable candidate's own fold-change by about 0.48 in the locked dataset, outside this tolerance -- though naive pooling is already caught by top_gene not matching at all, since it promotes a different gene outright. The adjusted p-value check has two parts: the reported value must be no larger than 2e-3, and it must sit within 3.0 orders of magnitude of the independently recomputed reference value, which is on the order of 5.8e-4 in the locked dataset -- deliberately not a landslide-significant value, since the strongest generalizable candidate's own headline effect is calibrated to not dominate its closest competitors on raw evidence alone. The scenarios that report a different gene entirely are not relying on this check to be caught at all: their own adjusted p-value can be numerically close to the reference value's order of magnitude, since more than one gene in this dataset is legitimately significant, but they are already caught by the separate check that the reported top_gene itself matches the independently recomputed answer. Both bounds are wide enough to tolerate legitimate differences in statistical implementation, but every incorrect analysis path that was actually tried against the locked dataset fails at least one of the checks overall, even when a specific numeric field happens to pass on its own."""

[verifier]
timeout_sec = 300.0
user = "root"
# environment_mode is intentionally unset. Do not use separate environment

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
# Client policy: the Oracle and the agent trials both run with public network
# in case the agent wants to check package documentation or pip install an
# alternative library version while debugging. The toolchain itself is not
# fetched at run time: numpy/pandas/scipy are vendored in wheels/ and
# installed offline at build time (see environment/Dockerfile).
network_mode = "public"
