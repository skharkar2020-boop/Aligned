schema_version = "1.1"

artifacts = [
    "/workspace/output/result.json",
]

[task]
name = "aligned/rnaseq-metadata-misalignment"
description = "Reproduce a trustworthy top differentially-expressed gene from a compound-response RNA-seq pipeline whose output can no longer be taken at face value."

[metadata]
author_name = "Shalmalee Kharkar"
author_email = "skharkar2020@gmail.com"
author_organization = "Aligned"
category = "data-ml-infrastructure"
tags = ["rna-seq", "differential-expression", "data-pipeline-debugging", "sample-metadata-alignment", "pandas", "silent-data-corruption"]
expert_time_estimate_hours = 12.0 # REPLACE: reconsider -- the task is now materially bigger (two cohorts, cross-cohort reconciliation) than when this was set.

# REPLACE all three: the task structure changed (single cohort -> two
# cohorts that disagree, new confounded_cohort output field). The previous
# explanations described the pre-redesign task and are no longer accurate.
# Write these in your own voice from task/solution/process.md and the
# calibration record in task/README.md. Do not have an LLM write these --
# see the note at the top of instruction.md.
difficulty_explanation = "REPLACE: name the scientific/reasoning bottleneck (two independent cohorts each give a complete, individually defensible, non-crashing analysis that disagree on the top gene; resolving it requires recognizing why one cohort's evidence doesn't generalize, not looking up a rule), why it's genuinely hard (three layered code defects gate reaching the reconciliation step at all, and naive pooling of both cohorts still looks plausible), and who does this work (a computational biologist reconciling conflicting replicate results before a go/no-go call)."
solution_explanation = "REPLACE: summarize solve.py's actual strategy -- fix the crash and the alignment bugs, split by cohort instead of pooling, run the same DE procedure independently per cohort, check whether each cohort's own top gene shows a same-signed nominal signal in the other cohort, and report the trustworthy cohort's result plus which cohort was confounded and why."
verification_explanation = "REPLACE: describe the independent per-cohort recomputation and replication check in test_outputs.py, and justify the log2_fold_change/adjusted_p_value tolerances against the specific wrong-scenario margins recorded in task/README.md's calibration table (naive pooling gets the gene right but the magnitude wrong; trusting the confounded cohort fails on confounded_cohort/top_gene/adjusted_p_value together)."

[verifier]
timeout_sec = 300.0
user = "root"
# environment_mode is intentionally unset. Do not use separate environment

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
# Client policy: the Oracle and the agent trials both run with public network
# in case the agent wants to check package documentation or pip install an
# alternative library version while debugging. The toolchain itself is not
# fetched at run time: numpy/pandas/scipy are vendored in wheels/ and
# installed offline at build time (see environment/Dockerfile).
network_mode = "public"
