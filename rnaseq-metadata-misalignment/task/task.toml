schema_version = "1.1"

artifacts = [
    "/workspace/output/result.json",
]

[task]
name = "aligned/rnaseq-metadata-misalignment"
description = "Reproduce a trustworthy top differentially-expressed gene from a compound-response RNA-seq pipeline whose output can no longer be taken at face value."

[metadata]
author_name = "Shalmalee Kharkar"
author_email = "skharkar2020@gmail.com"
author_organization = "Aligned"
category = "data-ml-infrastructure"
tags = ["rna-seq", "differential-expression", "data-pipeline-debugging", "sample-metadata-alignment", "pandas", "silent-data-corruption"]
expert_time_estimate_hours = 7.0 # Orientation + crash fix (~0.5-0.75h), tracing and fixing the alignment bug rather than trusting the shape-only assert (~1-1.5h), splitting by cohort and finding the disagreement (~0.5-0.75h), the core judgment work -- comparing pooled/per-cohort/meta-analysis strategies, sign-checking, technical-vs-biological reasoning, nominal-vs-adjusted for replication -- (~3-4.5h), writeup and sanity-check against the pilot report (~0.5h).

difficulty_explanation = """The expression matrix and sample metadata are synthetic, deterministically generated data built to model a realistic compound-response RNA-seq analysis, not real patient or public repository data. At first, the task looks like a fairly simple software debugging problem, but fixing the sample alignment and repairing the pipeline does not automatically lead to the right biological answer. The harder part is deciding which signals in the data can actually be trusted. Two genes show strong cohort-specific effects and look quite similar at first, but the reason behind each signal is very different. One moves together with several other genes only in cohort 2, pointing to a hidden technical factor rather than a real treatment effect. The other shows the same kind of cohort-specific reversal in treatment response but without this shared expression pattern, making it much more likely to reflect genuine biological heterogeneity rather than a processing artefact. The agent also has to consider the direction of the treatment effect and not just whether a result is statistically significant. A cohort-specific analysis can therefore nominate the wrong gene if it checks significance without checking whether the direction of the effect makes biological sense. Fisher's method creates a different problem because it combines evidence without considering direction. In this case it happens to arrive at the correct gene, but for the wrong methodological reason. The genuinely consistent candidate is also not an obvious winner, with only around a six-fold evidence advantage over its closest competitor. Depending on whether the agent pools the cohorts, analyses them separately, or combines their evidence, it can therefore end up with different answers. Getting the right result requires judging which signal is most likely to generalise across independent cohorts rather than simply choosing the smallest p-value or trusting whichever analysis produces the strongest-looking result. This makes the task a test of the same judgement a computational biologist or bioinformatician exercises when deciding whether a compound-response hit from a confirmatory cohort is trustworthy enough to advance, as much as it is a test of software debugging."""

solution_explanation = """The solution starts by diagnosing the same two problems that break the existing pipeline, then reimplements the analysis directly from the raw input files rather than editing and re-running the pipeline's own modules in place -- the two approaches reach the same result once both defects are correctly understood, and the reference solution's own correctness is checked against an independent, separately-written recomputation rather than against the pipeline code itself. The first defect is the deprecated NumPy cast, which causes the pipeline to crash immediately but is otherwise unrelated to the scientific problem. The more important issue is the sample alignment bug. During QC, the metadata is sorted by sample_id as strings, while the expression matrix remains in the original sequencer acquisition order. The pipeline then combines the two by position rather than matching them using the actual sample IDs, which means that most expression profiles end up attached to the wrong condition labels. The existing assert combined.shape[0] == metadata.shape[0] check does not catch this because it only confirms that the same number of samples are present after the merge. It does not check whether the expression profile in each row still belongs to the sample_id shown next to it. The reference solution reads the raw expression matrix and metadata directly and joins them explicitly on sample_id, which fixes the same defect in substance without requiring an edit to pipeline/io.py or pipeline/align.py specifically.

Once the alignment is repaired, the two cohorts should be analysed separately rather than pooled. The same differential-expression procedure is applied independently to cohort 1 and cohort 2 using log2-CPM expression, Welch's t-test and BH-FDR correction. For a top candidate identified in one cohort to be considered replicated, that specific candidate must also show nominal significance in the other cohort and the treatment effect must point in the same direction. The use of nominal significance applies specifically to this confirmation step. Cohort 2 can still use BH correction when it is being analysed independently for discovery, but when testing a candidate that has already been flagged in cohort 1, the question is whether that particular gene replicates rather than whether it independently survives another search across all 300 genes. Applying BH adjustment across the full gene set again for this single confirmation test can therefore be unnecessarily restrictive. This distinction matters in practice: in a fresh trial, using the BH-adjusted cohort 2 value instead of the nominal p-value at this step was enough to flip the analysis to the wrong answer.

More than one gene can pass this replication check, and a weaker effect in one cohort is not automatically a reason to reject a candidate. Some degree of cross-cohort heterogeneity is expected, provided that the effect remains real and points in the same direction. In this dataset, as many as three candidates can satisfy that requirement. When several genes survive, the tiebreak is the strength of the evidence across both cohorts rather than simply choosing the gene with the most similar effect size in each one. Fisher's method can be used to combine the two nominal p-values at this stage because agreement in effect direction has already been established.

The competing signals also need to be examined rather than rejected only because they fail the replication rule. In particular, the rejected_competing_gene should be the gene whose apparent effect is linked to a technical artefact, not the gene showing genuine biological heterogeneity. This can be distinguished by checking whether several other genes move together with the candidate specifically within the same cohort. A shared cohort-specific expression pattern suggests that the signal is being driven by an underlying technical factor, whereas a gene showing a cohort-specific change without that broader shared structure is more consistent with real biological variation.

The final output should report the surviving gene using the statistics from the cohort in which its evidence is strongest, while also giving its fold-change in both cohorts. It should include the appropriate categorical heterogeneity assessment, the number of samples whose IDs were verified to match correctly after repairing the pipeline, and the competing gene that was rejected together with the reason for rejecting it. Finally, the historical pilot report in the repository describes an earlier, underpowered finding without naming a specific gene or giving numbers that identify one; it exists as a caution against assuming any prior claim is correct, not as corroborating evidence for whichever gene the current analysis nominates. The result has to be established entirely from the current dataset, independent of anything the pilot report does or does not say."""

verification_explanation = """The reference answer was checked independently rather than simply assuming that the repaired pipeline produced the correct result. The same analysis was run using two different major versions of pandas, from the 1.x and 2.x series, on the same input files and produced identical results. It was then cross-checked using a completely separate implementation that did not reuse the pipeline code or solve.py, but instead matched the two raw input files directly using sample_id. This produced the same answer, confirming that the reference result was not dependent on a particular implementation or software version.

The verifier checks more than just whether the correct gene was found. It requires the correct top_gene and rejected_competing_gene, checks both cohort-level fold-changes within tolerance, and verifies the heterogeneity_assessment label. analysis_strategy must still be one of five valid codes, but is no longer scored against the single reference code directly: repeated independent review found that an exact match there amounted to an undisclosed requirement to guess this task's internal label for a correct line of reasoning, on top of every other field already having to agree with the correct answer. It also checks verified_matching_sample_ids to make sure the alignment problem was actually fixed, and requires the rationale to explicitly state that the rejected competing gene's effect points the opposite direction between cohorts -- not merely to be present and non-trivial -- which is what actually closes the gap the analysis_strategy match was originally meant to catch.

To make sure these checks could separate a sound analysis from a plausible but incorrect one, six different wrong strategies were run against the locked dataset. A naive pooled analysis produces a completely different gene. Analysing cohort 2 alone also gives a different answer, and although that gene is nominally significant in cohort 1, its effect goes in the opposite direction. Looking only at significance would therefore make it appear to replicate when it actually does not. A sign-blind Fisher's method creates a more subtle problem because it happens to select the correct gene in this dataset, but it gets there without considering whether the effects agree in direction. It therefore reaches the right answer for the wrong methodological reason and still fails the verifier: a rationale built on that method has no honest basis to state that the rejected gene's own effect reverses direction between cohorts, since the method never checked for that, and the verifier requires exactly that claim to be made explicitly.

Another plausible approach is to choose the gene with the most similar effect across the two cohorts. That gene genuinely replicates and is therefore not an obviously bad candidate, but the combined evidence supporting it is around six times weaker than for the reference gene. This makes the choice a genuine judgement call rather than an obvious statistical decision. A replication rule based only on significance creates a different failure by allowing the technical-artifact gene to pass without checking the direction of its effect. There is also a separate trap around rejected_competing_gene: choosing the gene showing real biological heterogeneity is still incorrect even though excluding it as the final top_gene is appropriate. Its cohort-specific signal appears to be real, while the competitor that should be reported as rejected is the one linked to the technical artefact.

All six approaches differ from the locked reference on at least one field checked by the verifier, and importantly, they fail for different reasons. An agent can pool cohorts when it should not, ignore the direction of an effect, favour consistency over stronger overall evidence, or mistake real heterogeneity for a technical artefact. An analysis can even happen to identify the correct gene but still fail because the strategy used to reach it is not scientifically sound and cannot honestly justify, in the rationale, why the rejected competitor's own effect reverses direction between cohorts. The verifier therefore tests the reasoning used to reach the result rather than simply whether the expected gene name appears in the output.

A correlation-based check was also tested during task development to see whether the latent technical effect could be identified directly from groups of genes moving together. This was ultimately left out because there are only six samples in each cohort-condition group, making the correlations too noisy to reliably distinguish a genuinely linked gene from an unrelated one. Rather than including a check that was not statistically reliable at this sample size, the final verifier focuses on results that can be reproduced consistently from the locked dataset.

The numeric tolerances were set from those same wrong-scenario margins rather than chosen arbitrarily. The fold-change check allows a difference of up to 0.2 from the independently recomputed value; log2 fold-change is essentially a plain difference of group means, so it barely moves between reasonable implementation choices (Welch's versus Student's t-test, a different multiple-testing correction), but naive pooling of both cohorts alone moves the true gene's own fold-change by about 0.8 in the locked dataset, four times outside this tolerance. The adjusted p-value check has two parts: the reported value must be no larger than 5e-4, and it must sit within 3.0 orders of magnitude of the independently recomputed reference value, which is on the order of 1e-5 for the true gene. Naive pooling's own adjusted p-value for that same gene is on the order of 1e-3, an order of magnitude too large to clear the 5e-4 ceiling on its own. The scenarios that report a different gene entirely are not relying on this check to be caught at all: their own adjusted p-value can be numerically close to the reference value's order of magnitude, since more than one gene in this dataset is legitimately significant, but they are already caught by the separate check that the reported top_gene itself matches the independently recomputed answer. Both bounds are wide enough to tolerate legitimate differences in statistical implementation, but every incorrect analysis path that was actually tried against the locked dataset fails at least one of the checks overall, even when a specific numeric field happens to pass on its own."""

[verifier]
timeout_sec = 300.0
user = "root"
# environment_mode is intentionally unset. Do not use separate environment

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
# Client policy: the Oracle and the agent trials both run with public network
# in case the agent wants to check package documentation or pip install an
# alternative library version while debugging. The toolchain itself is not
# fetched at run time: numpy/pandas/scipy are vendored in wheels/ and
# installed offline at build time (see environment/Dockerfile).
network_mode = "public"
