schema_version = "1.1"

artifacts = [
    "/workspace/output/result.json",
    "/workspace/output/subject_metrics.csv",
]

[task]
name = "aligned/metabolite-decoy-trap"
description = "Nominate which of a drug candidate's parent compound and two metabolites (M1, M2) is the true dose-adjusted pharmacodynamic driver, from sparse longitudinal PK/PD data spanning 32 subjects across single/repeated-dose and low/high-dose cohorts, requiring both subject-level exposure metrics and population-level dose-and-regimen-adjusted association analysis."

[metadata]
author_name = "Shalmalee Kharkar"
author_email = "skharkar2020@gmail.com"
author_organization = "Aligned"
category = "scientific-computing"
tags = ["scientific-computing", "data-analysis", "python", "pytest", "pharmacokinetics", "pharmacodynamics", "non-compartmental-analysis", "confounding"]
expert_time_estimate_hours = 4.5 # updated for the v2 redesign; see README.md's data-provenance section for the revision history

difficulty_explanation = "A clinical pharmacologist selecting an exposure-response biomarker from longitudinal PK/PD data must distinguish a genuine dose-independent pharmacodynamic driver from a confounded decoy. M1 (and, to a lesser extent, the parent compound) both look like the obvious answer under a naive analysis: highest Cmax, largest early-exposure AUC, and the strongest unadjusted correlation with PD response. That correlation is a Simpson's-paradox artifact -- both M1's exposure and PD (via the true driver, M2) scale with administered dose, so they move together across dose cohorts even though M1 has no real subject-level relationship with PD. Only M2's relationship survives dose x regimen adjustment, holds under repeated dosing (where M2 genuinely accumulates and M1 does not), reflects the pharmacologically relevant sustained-exposure window rather than an instantaneous peak, and is not driven by any single subject under leave-one-out. The task requires computing a full non-compartmental subject-level metric set (Cmax, Tmax, multiple AUC windows, trough) from sparse concentration-time samples under an explicit but non-obvious time-coordinate convention (time relative to each subject's most recent dose, not absolute time since first dose), then comparing four different population-level association analyses per candidate to determine which one is actually decision-relevant. Trusting the single strongest-looking correlation, or pooling across dose levels and regimens before adjusting, reaches the wrong answer. The data is synthetic but models a common, realistic PK/PD pattern (a slowly-forming, slowly-clearing true driver overshadowed by a fast-forming, fast-clearing decoy whose apparent effect is entirely a dose confound) -- this is the kind of exposure-response biomarker triage a clinical pharmacologist performs when deciding which circulating species to carry forward as the dose-selection biomarker for later-phase trials."
solution_explanation = "The reference solution computes, per subject and analyte, Cmax, Tmax (relative to that subject's most recent dose), AUC0-6 and AUC0-12 (trapezoidal rule, anchored with a synthetic zero-concentration point at the dose time when no sample exists there), trough (repeated-dose subjects), and a regimen-appropriate 'relevant' sustained-exposure AUC (AUC8-24 for single-dose subjects, steady-state AUCtau for repeated-dose subjects) -- this is subject_metrics.csv. From these, it computes four population-level association measures per candidate species: a naive (unadjusted) correlation, a dose x regimen-adjusted correlation (centering both variables within each of the four dose-level x regimen cohorts), a repeated-dose-only correlation, and a pooled correlation using the sustained-exposure window, plus leave-one-out minima for the naive and sustained-exposure correlations. It nominates the species that simultaneously leads all three adjusted/robust criteria (dose x regimen-adjusted, repeated-dose, sustained-exposure), not the one with the strongest naive correlation."
verification_explanation = "The verifier independently recomputes the entire pipeline (subject_metrics.csv and every result.json field) from its own copy of the data and checks: (1) subject_metrics.csv contains exactly the 96 expected (subject_id, analyte) rows, each present once; (2) every subject-level field matches the verifier's own recomputation within 1% relative tolerance (or a small absolute floor near zero) -- tight because the task specifies the trapezoidal rule exclusively, so a materially different integration method should not pass, while tmax_hr (a discrete lookup, not a numerical approximation) must match exactly; (3) result.json has the correct schema and finite, in-range values; (4) every reported population-level aggregate matches independent recomputation (0.02 absolute tolerance for correlations, 5% for accumulation ratios, reflecting two compounded subject-level tolerances); (5) the nominated species' recomputed dose x regimen-adjusted, repeated-dose, and sustained-exposure correlations each exceed the best of the other two candidates' corresponding values by at least 0.05 -- chosen well below the >=0.16 margin M2 achieves on every one of those three criteria in the shipped dataset (0.49 on the adjusted criterion alone), so it tolerates a reasonable alternative computation while still rejecting a wrong nomination (a wrong nomination fails by 0.4-0.7 on the adjusted criterion). Manually verified both 'M1' and 'parent' nominations fail this check."

[verifier]
timeout_sec = 300.0
user = "root"
# environment_mode is intentionally unset. Do not use separate environment

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
# Client policy: the Oracle and the agent trials both run with public network so
# they can reach scientific databases and tools over HTTP. The toolchain is not
# fetched at run time: keep Python libraries and code vendored in the image.
network_mode = "public"
