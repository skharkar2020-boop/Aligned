schema_version = "1.1"

artifacts = [
    "/workspace/output/result.json",
]

[task]
name = "aligned/metabolite-decoy-trap"
description = "Nominate which of a drug candidate's parent compound and two metabolites (M1, M2) is the true pharmacodynamic driver, from sparse PK/PD data spanning single-dose and multi-dose steady-state cohorts."

[metadata]
author_name = "Shalmalee Kharkar"
author_email = "skharkar2020@gmail.com"
author_organization = "Aligned"
category = "scientific-computing"
tags = ["scientific-computing", "data-analysis", "python", "pytest", "pharmacokinetics", "pharmacodynamics"]
expert_time_estimate_hours = 2.5

difficulty_explanation = "A clinical pharmacologist selecting an exposure-response biomarker from early-phase PK/PD data must distinguish a genuine pharmacodynamic driver from a confounded decoy: in the single-dose cohort a hidden per-subject covariate makes M2's exposure track PD almost as well as the true driver, M1. Trusting a single cohort, or pooling both dosing regimens before correlating, does not reliably separate the two. The task requires recognizing that the data spans two dosing regimens (single dose vs. repeated dosing to steady state), computing a defensible per-subject exposure estimate from sparse concentration-time samples, and checking which candidate's exposure-response relationship survives across both regimens rather than trusting the regimen where it looks strongest at first glance. The data is synthetically generated but modeled on a realistic, common PK/PD pattern (a pharmacodynamic effect that only engages once exposure crosses a threshold reachable by accumulation but not by a single dose), so the confound is a plausible one a pharmacologist could encounter with real compounds, not an artificial trick. This is the kind of exposure-response biomarker triage a clinical pharmacologist performs when deciding which circulating species to carry forward as the dose-selection biomarker for later-phase trials."
solution_explanation = "The reference solution computes each subject's per-analyte exposure (AUC) via the trapezoidal rule over the visible sparse concentration-time samples, splits subjects by actual dosing regimen (n_doses == 1 vs. n_doses > 1, not the cohort label string), computes each candidate's Pearson correlation between AUC and PD response separately within each regimen, and nominates the species whose association is strongest in the multi-dose steady-state regimen, since that regimen gives each subject a more stable exposure estimate and single-dose-specific confounds are less likely to persist."
verification_explanation = "The verifier independently recomputes the same AUC/correlation pipeline from its own copy of the data and checks: (1) result.json has exactly the required keys, a nominated species from the valid set, and finite association values in [-1, 1]; (2) the nominated species' recomputed multi-dose association exceeds every other candidate's own recomputed value by at least 0.04 -- a relative-dominance margin set below the ~0.06-0.11 margin observed across independent seeds during authoring, so it tolerates a reasonable alternative AUC methodology while still rejecting a wrong nomination; (3) the agent's reported single_dose_association and multi_dose_association for the nominated species are within 0.20 of the verifier's independent recomputation, to catch fabricated or copy-pasted numbers."

[verifier]
timeout_sec = 300.0
user = "root"
# environment_mode is intentionally unset. Do not use separate environment

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
# Client policy: the Oracle and the agent trials both run with public network so
# they can reach scientific databases and tools over HTTP. The toolchain is not
# fetched at run time: keep Python libraries and code vendored in the image.
network_mode = "public"
