schema_version = "1.1"

artifacts = [
    "/workspace/output/result.json",
    "/workspace/output/compound_metrics.csv",
]

[task]
name = "aligned/lipophilic-efficiency-trap"
description = "Nominate which of 30 hit-to-lead analogs against a kinase target should progress to lead optimization, from raw replicate potency assays (with QC-flagged failed replicates) and ADME/physicochemical descriptors. Correctly recovering the intended lead requires integrating potency, selectivity, lipophilic ligand efficiency, and developability together -- no single disclosed threshold, sort, or naive composite recovers it alone, including a mechanical apply-the-disclosed-gate-then-sort-by-LLE shortcut, which lands on a compound with excellent efficiency but plainly negative (non-)selectivity instead."

[metadata]
author_name = "Shalmalee Kharkar"
author_email = "skharkar2020@gmail.com"
author_organization = "Aligned"
category = "scientific-computing"
tags = ["scientific-computing", "data-analysis", "python", "pytest", "medicinal-chemistry", "hit-to-lead", "ligand-efficiency", "confounding"]
expert_time_estimate_hours = 2.5

difficulty_explanation = "A medicinal chemist triaging a hit-to-lead series must integrate potency, selectivity, ligand efficiency, and developability at once -- optimizing any single axis in isolation picks the wrong compound. This dataset embeds six deliberately competing archetypes among 24 generic background compounds: the highest raw-potency compound (C101) fails developability because that potency is bought with clogP=5.0; the highest-LLE compound in the entire population (C104) fails developability via an independent metabolic liability unrelated to its own (low-moderate) clogP; the most selective compound (C103) has only mediocre efficiency; the cleanest, lowest-clogP compound (C102) is simply outclassed on potency, LLE, and selectivity by the intended lead; and critically, the highest-LLE compound AMONG developability-passing compounds (C106) has a negative selectivity_index -- it is more potent against the off-target paralog than the primary target. This last compound was added specifically because a manual mechanical-shortcut test showed that applying only the disclosed developability threshold and sorting by LLE -- using zero information beyond the literal instruction.md contract -- was otherwise sufficient to reach a wrong answer with no scientific reasoning at all. The intended lead (C105) does not dominate every competitor (C101 beats it on raw potency, C103 beats it on selectivity, C104 and C106 both beat it on raw LLE) but is the only compound simultaneously developable, genuinely selective (selectivity_index > 0, not merely a magnitude above some hidden cutoff -- C106's failure is a sign flip, not a borderline case), and efficient. The task also requires correctly excluding QC-failed assay replicates before averaging -- skipping that step corrupts the pIC50 averages silently. Manually verified the correct nomination's margin over the nearest real competitor (0.32 lle units) is stable under an alternate, equally defensible averaging method (mean-IC50-then-log vs. mean-pIC50, margins 0.3221 vs 0.3228). Earlier, simpler versions of this dataset were validated too easy: a single-confound version passed 12/12 across three agent families (Claude, Codex, Gemini) by sorting the raw table; a version that additionally reported clogp-vs-potency correlations as computed result.json fields let an agent quote the reported r=0.999 verbatim as its reasoning rather than deriving the confound itself. Both findings drove this redesign."
solution_explanation = "The reference solution filters assay_results.csv to qc_flag == 'pass' rows, converts each surviving replicate's IC50 (nM) to pIC50 (9 - log10(IC50_nM)), and averages within (compound_id, assay) to get pic50_target and pic50_offtarget per compound. From these and adme_properties.csv it computes selectivity_index (pic50_target - pic50_offtarget), lle (pic50_target - clogp), le (1.4 * pic50_target / heavy_atom_count), and developability_pass (solubility_um >= 20 AND clint_ul_min_mg <= 45 AND papp_1e6cm_s >= 8) -- this is compound_metrics.csv. result.json reports naive_top_potency_id (argmax pic50_target, unconditional) and n_developability_pass. For the final nomination (not a disclosed formula), the reference solution restricts to compounds with developability_pass == true AND selectivity_index > 0 -- a natural zero-point (genuinely more potent against the target than the off-target paralog), not a tuned magic number -- then nominates the highest-lle compound within that set. The key insight is that no single disclosed metric is sufficient: applying the disclosed developability threshold alone and sorting by LLE selects a different, non-selective compound instead."
verification_explanation = "The verifier independently recomputes the entire pipeline (compound_metrics.csv and every result.json field) from its own copy of the data (tests/data/) and checks: (1) compound_metrics.csv has exactly the expected 30 rows, one per compound, with all required columns; (2) every numeric field matches the verifier's own recomputation within 1% relative tolerance (0.02 absolute floor), and developability_pass matches exactly -- tight because every computation here is simple arithmetic on already-clean inputs, not a numerical approximation; (3) result.json has the correct schema and finite, in-range values; (4) naive_top_potency_id and n_developability_pass match independent recomputation exactly; (5) nominated_lead_id must exactly equal the verifier's own independently recomputed value -- a discrete correctness check against an undisclosed but principled selection rule (developability gate + selectivity_index > 0, a natural zero-point rather than a tuned threshold + argmax LLE), not a statistical margin, so there is no arbitrary cutoff to tune around. Manually verified that the naive-potency decoy (C101, fails developability), the raw-LLE decoy (C104, fails developability via an independent metabolic liability), the selectivity-only decoy (C103, mediocre LLE), the conservative-but-weaker option (C102), and critically the mechanical-shortcut decoy (C106, passes every disclosed threshold and has near-top LLE but negative selectivity) all fail this check when substituted for the correct answer, with a comfortable, method-robust margin (0.322 lle units) over the nearest real competitor."

[verifier]
timeout_sec = 300.0
user = "root"
# environment_mode is intentionally unset. Do not use separate environment

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
# Client policy: the Oracle and the agent trials both run with public network so
# they can reach scientific databases and tools over HTTP. The toolchain is not
# fetched at run time: keep Python libraries and code vendored in the image.
network_mode = "public"
