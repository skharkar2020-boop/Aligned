schema_version = "1.1"

artifacts = [
    "/workspace/output/result.json",
    "/workspace/output/compound_metrics.csv",
]

[task]
name = "aligned/lipophilic-efficiency-trap"
description = "Nominate which of 28 hit-to-lead analogs against a kinase target should progress to lead optimization, from raw replicate potency assays (with QC-flagged failed replicates) and ADME/physicochemical descriptors, requiring both compound-level derived metrics and a selectivity- and developability-adjusted lipophilic ligand efficiency analysis that overturns the naive highest-potency pick."

[metadata]
author_name = "Shalmalee Kharkar"
author_email = "skharkar2020@gmail.com"
author_organization = "Aligned"
category = "scientific-computing"
tags = ["scientific-computing", "data-analysis", "python", "pytest", "medicinal-chemistry", "hit-to-lead", "ligand-efficiency", "confounding"]
expert_time_estimate_hours = 2.5

difficulty_explanation = "A medicinal chemist triaging a hit-to-lead series must distinguish a compound whose potency comes from genuine, target-specific structure-activity relationship (SAR) from one whose potency is inflated by nonspecific lipophilic binding. In this dataset, the single most potent compound by raw pIC50 (C022) achieves that potency largely through high lipophilicity (clogP = 5.10) -- the same lipophilicity that drives its off-target liability and its poor metabolic stability and permeability. It fails the developability gate outright. The genuinely best lead (C027) ranks only 5th on raw potency but has the best lipophilic ligand efficiency (pIC50 - clogP) among compounds that both clear the developability bar (solubility, metabolic clearance, permeability) and hit a defensible selectivity margin -- a realistic, well-documented med-chem pattern (lipophilicity-driven potency creep degrading selectivity and ADME, motivating LLE/LipE as a lead-selection metric in the first place). The instruction discloses the individual compound-level formulas (pIC50 conversion, selectivity index, LLE, LE, developability thresholds) but not the rule for combining them into a final nomination, and result.json does not report any lipophilicity/potency correlation -- the agent has to independently decide to check whether raw potency is confounded by lipophilicity (by inspecting compound_metrics.csv's own columns) rather than being handed that diagnostic as a computed output. The task also requires correctly excluding QC-failed assay replicates before averaging (9 of 168 replicates are flagged fail, with corrupted values) -- skipping that step corrupts the pIC50 averages silently. Manually verified the correct nomination differs from naive_top_potency_id and from every other developability-passing compound, with a comfortable margin (0.16 lle units between the top two candidates) that easily absorbs correct-but-differently-rounded recomputation. An earlier draft additionally reported clogp-vs-potency correlations in result.json; a quick-trial run showed the agent quoting the reported r = 0.999 value verbatim as its stated reasoning, which meant the task was rewarding reading a supplied number rather than deriving the confound -- those fields were removed after that finding."
solution_explanation = "The reference solution filters assay_results.csv to qc_flag == 'pass' rows, converts each surviving replicate's IC50 (nM) to pIC50 (9 - log10(IC50_nM)), and averages within (compound_id, assay) to get pic50_target and pic50_offtarget per compound. From these and adme_properties.csv it computes selectivity_index (pic50_target - pic50_offtarget), lle (pic50_target - clogp), le (1.4 * pic50_target / heavy_atom_count), and developability_pass (solubility_um >= 20 AND clint_ul_min_mg <= 45 AND papp_1e6cm_s >= 8) -- this is compound_metrics.csv. result.json reports naive_top_potency_id (argmax pic50_target, unconditional) and n_developability_pass. For the final nomination (not a disclosed formula), the reference solution restricts to compounds with developability_pass == true AND selectivity_index >= 0.6 (~4-fold selectivity), then nominates the highest-lle compound within that set -- the key insight is that lipophilicity drives both on-target and (more strongly) off-target potency, so selectivity and LLE together isolate genuine SAR from a lipophilicity confound."
verification_explanation = "The verifier independently recomputes the entire pipeline (compound_metrics.csv and every result.json field) from its own copy of the data (tests/data/) and checks: (1) compound_metrics.csv has exactly the expected 28 rows, one per compound, with all required columns; (2) every numeric field matches the verifier's own recomputation within 1% relative tolerance (0.02 absolute floor), and developability_pass matches exactly -- tight because every computation here is simple arithmetic on already-clean inputs, not a numerical approximation; (3) result.json has the correct schema and finite, in-range values; (4) naive_top_potency_id and n_developability_pass match independent recomputation exactly; (5) nominated_lead_id must exactly equal the verifier's own independently recomputed value -- a discrete correctness check against an undisclosed but principled selection rule (developability gate + a ~4-fold selectivity bar + argmax LLE), not a statistical margin, so there is no threshold to tune around. Manually verified both the naive-potency decoy (C022, fails the developability gate) and the second-best candidate (C028, 0.16 lle units behind) fail this check when substituted for the correct answer."

[verifier]
timeout_sec = 300.0
user = "root"
# environment_mode is intentionally unset. Do not use separate environment

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
# Client policy: the Oracle and the agent trials both run with public network so
# they can reach scientific databases and tools over HTTP. The toolchain is not
# fetched at run time: keep Python libraries and code vendored in the image.
network_mode = "public"
